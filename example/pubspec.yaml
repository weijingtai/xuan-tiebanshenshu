name: tiebanshenshu_example
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  tiebanshenshu:
    path: ../
  repository_interface_tiebanshenshu:
    path: ../../repository-interface-tiebanshenshu
  persistence_assets:
    path: ../../xuan-storage/assets
  persistence_drift:
    path: ../../xuan-storage/drift
  persistence_preferences:
    path: ../../xuan-storage/preferences
  shared_preferences: ^2.2.0
  drift: ^2.30.1

  provider: any
  timezone: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5

  metaphysics_core: any
  logger: any
flutter:
  uses-material-design: true

  assets:
    - assets/all_tiao_wen_v1.csv
    - assets/formulas/
    - assets/kao_ke/

dependency_overrides:
  theme:
    path: ../../theme
  calendar:
    path: ../../calendar
  persistence_domain:
    path: ../../xuan-domain
  xuan_time_location:
    path: ../../xuan-time-location
  repository_interface_four_zhu_card:
    path: ../../repository-interface-four-zhu-card
  xuan_common_ui:
    path: ../../xuan-common-ui
  xuan_four_zhu_card:
    path: ../../xuan-four-zhu-card
  persistence_core:
    path: ../../xuan-storage/core
  persistence_drift:
    path: ../../xuan-storage/drift
  persistence_preferences:
    path: ../../xuan-storage/preferences
  metaphysics_core:
    path: ../../xuan-metaphysics-core
  repository_interface_tiebanshenshu:
    path: ../../repository-interface-tiebanshenshu
  xuan_gua_core:
    path: ../../xuan-gua-core
  persistence_assets:
    path: ../../xuan-storage/assets
